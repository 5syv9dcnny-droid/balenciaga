<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pepe Balenciaga New Year Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0d1b2a, #1b263b, #415a77);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        /* Снег */
        .snowflake {
            position: absolute;
            top: -10px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.8;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) translateX(0); }
            50% { transform: translateY(50vh) translateX(20px); }
            100% { transform: translateY(105vh) translateX(-20px); }
        }
        /* Неоновый банер */
        .banner {
            margin-top: 10px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #ffd700;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 10px #ff4500, 0 0 20px #ff4500;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            animation: pulseBanner 1.5s infinite alternate;
            z-index: 10;
        }
        @keyframes pulseBanner {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255,215,0,0.4); }
            100% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,215,0,0.8); }
        }
        /* Шапка с балансом */
        .header {
            text-align: center;
            z-index: 10;
        }
        .score {
            font-size: 32px;
            font-weight: 900;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.6);
        }
        .stars-wallet {
            font-size: 16px;
            color: #ffd700;
            margin-top: 2px;
        }
        /* Главный персонаж (Пепе) */
        .pepe-container {
            position: relative;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .pepe {
            width: 200px;
            height: 200px;
            background: #2ecc71;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.1s ease;
        }
        .pepe:active {
            transform: scale(0.92);
        }
        .hat {
            position: absolute;
            top: -45px;
            font-size: 60px;
        }
        .eyes {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }
        .eye {
            width: 35px;
            height: 45px;
            background: #fff;
            border-radius: 50%;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pupil {
            width: 14px;
            height: 14px;
            background: #000;
            border-radius: 50%;
        }
        .mouth {
            width: 80px;
            height: 25px;
            border-bottom: 5px solid #000;
            border-radius: 0 0 50px 50px;
        }
        /* Падающие клики (+1) */
        .click-pop {
            position: absolute;
            font-weight: bold;
            color: #ffd700;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 20;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1.3); opacity: 0; }
        }
        /* Меню / Магазин / Кнопки */
        .menu-panel {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 30, 48, 0.9);
            border-top: 2px solid #415a77;
            border-radius: 20px 20px 0 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }
        .btn {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-pizza {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
        }
        .audio-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button class="audio-toggle" id="audioBtn">🎵</button>

    <div class="banner">HELLO @BALENCIAGA!</div>

    <div class="header">
        <div class="score" id="score">0</div>
        <div class="stars-wallet" id="starsWallet">⭐ Звезд: 0</div>
    </div>

    <div class="pepe-container" id="pepeBtn">
        <div class="pepe">
            <div class="hat">🎅</div>
            <div class="eyes">
                <div class="eye"><div class="pupil" id="pupil1"></div></div>
                <div class="eye"><div class="pupil" id="pupil2"></div></div>
            </div>
            <div class="mouth"></div>
        </div>
    </div>

    <div class="menu-panel">
        <button class="btn btn-pizza" onclick="buyPizza()">
            <span>🍕 Купить Новогоднюю Пиццу</span>
            <span>⭐ 5 Звезд</span>
        </button>
        <button class="btn" onclick="upgradePower()">
            <span>⚡ Усиление Тапа (+1)</span>
            <span id="upgradeCost">💰 50 очков</span>
        </button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let stars = 0;
        let tapPower = 1;
        let upgradeCostVal = 50;
        let audioEnabled = false;
        let audioCtx = null;

        // Генерация снега
        function createSnowflakes() {
            const count = 30;
            for (let i = 0; i < count; i++) {
                const snow = document.createElement('div');
                snow.classList.add('snowflake');
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.width = snow.style.height = (Math.random() * 6 + 3) + 'px';
                snow.style.animationDuration = (Math.random() * 3 + 2) + 's';
                snow.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(snow);
            }
        }
        createSnowflakes();

        // Аудиосинтезатор (Web Audio API)
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(freq, duration, type = 'sine') {
            if (!audioEnabled || !audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        document.getElementById('audioBtn').addEventListener('click', () => {
            initAudio();
            audioEnabled = !audioEnabled;
            document.getElementById('audioBtn').textContent = audioEnabled ? '🔊' : '🎵';
            if(audioEnabled) playSound(523.25, 0.2);
        });

        // Тап по Пепе
        const pepeBtn = document.getElementById('pepeBtn');
        const scoreEl = document.getElementById('score');
        const starsWalletEl = document.getElementById('starsWallet');

        pepeBtn.addEventListener('click', (e) => {
            score += tapPower;
            scoreEl.textContent = score;
            
            // Шанс выпадения звезды в игре (1% на тап)
            if (Math.random() < 0.05) {
                stars += 1;
                starsWalletEl.textContent = `⭐ Звезд: ${stars}`;
                playSound(880, 0.3);
            } else {
                playSound(440, 0.1);
            }

            // Анимация текста при клике
            const pop = document.createElement('div');
            pop.classList.add('click-pop');
            pop.textContent = `+${tapPower}`;
            pop.style.left = (e.clientX - 15) + 'px';
            pop.style.top = (e.clientY - 30) + 'px';
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 800);

            // Вибрация в Telegram, если доступна
            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Покупка прокачки
        function upgradePower() {
            initAudio();
            if (score >= upgradeCostVal) {
                score -= upgradeCostVal;
                tapPower += 1;
                upgradeCostVal = Math.floor(upgradeCostVal * 1.8);
                scoreEl.textContent = score;
                document.getElementById('upgradeCost').textContent = `💰 ${upgradeCostVal} очков`;
                playSound(659.25, 0.2);
            } else {
                playSound(200, 0.3, 'sawtooth');
            }
        }

        // Покупка пиццы за Telegram Stars (симуляция)
        function buyPizza() {
            initAudio();
            if (tg && tg.openInvoice) {
                // Если бот настроен через Telegram Stars API
                tg.showAlert("Запрос на покупку новогодней пиццы за 5 Telegram Stars!");
            } else {
                // Симуляция для демо-режима в браузере
                stars += 5; // бонусные звезды за клик по пицце
                starsWalletEl.textContent = `⭐ Звезд: ${stars}`;
                playSound(783.99, 0.4);
                alert("🍕 Новогодняя пицца успешно куплена! Вы получили бонусные звезды!");
            }
        }
    </script>
</body>
</html>
